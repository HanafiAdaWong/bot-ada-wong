services:
  ada-wong:
    build: .
    container_name: ada-wong
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ada-wong-data:/app/data

volumes:
  ada-wong-data:
